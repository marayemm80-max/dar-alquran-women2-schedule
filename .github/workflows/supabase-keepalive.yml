name: Supabase connection check

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check database connection
        env:
          SUPABASE_KEY: sb_publishable_CpURFDtAk6StsmbsxevEIw_KxQlrrDo
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --max-time 30 \
            --header "apikey: $SUPABASE_KEY" \
            --output /dev/null \
            'https://dticcjibqumkerjwcsae.supabase.co/rest/v1/dar_quran_data?select=id&limit=1'
          echo "Database connection successful"
